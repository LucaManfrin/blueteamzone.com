# =====================================================================
#  Netlify configuration — security-first, static Astro site.
# =====================================================================

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Never print secrets in logs; we don't use any, but be explicit.
  NPM_FLAGS = "--no-audit --no-fund"

# ---------------------------------------------------------------------
#  Security headers — applied to every response.
# ---------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    # Lock content sources to self. No inline scripts (the site ships none),
    # styles allow inline because Astro/Shiki emit style attributes.
    Content-Security-Policy = """
      default-src 'self';
      base-uri 'self';
      form-action 'self';
      frame-ancestors 'none';
      frame-src 'none';
      object-src 'none';
      script-src 'self';
      style-src 'self' 'unsafe-inline';
      img-src 'self' data:;
      font-src 'self';
      connect-src 'self';
      manifest-src 'self';
      worker-src 'self';
      upgrade-insecure-requests
    """
    # Force HTTPS for 2 years, include subdomains, allow preload list.
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # Defense-in-depth clickjacking protection (CSP frame-ancestors is primary).
    X-Frame-Options = "DENY"
    # Stop MIME sniffing.
    X-Content-Type-Options = "nosniff"
    # Minimise referrer leakage.
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Disable powerful features the blog never uses.
    Permissions-Policy = "accelerometer=(), autoplay=(), camera=(), clipboard-read=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), interest-cohort=()"
    # Cross-origin isolation.
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
    # Don't advertise the stack.
    X-Permitted-Cross-Domain-Policies = "none"
    X-DNS-Prefetch-Control = "off"

# ---------------------------------------------------------------------
#  Cache rules.
# ---------------------------------------------------------------------
# Fingerprinted Astro assets are immutable -> cache hard.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static images.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# HTML should always be revalidated so new posts appear immediately.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Feeds / index: short cache.
[[headers]]
  for = "/rss.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/search-index.json"
  [headers.values]
    Cache-Control = "public, max-age=300"
    Content-Type = "application/json; charset=utf-8"

# ---------------------------------------------------------------------
#  Redirects.
#  Netlify automatically serves /404.html for unknown paths, so no SPA
#  catch-all is needed. Add canonical host redirects below if desired.
# ---------------------------------------------------------------------
# Example (uncomment + edit once your domain is live):
# [[redirects]]
#   from = "https://www.example.com/*"
#   to = "https://example.com/:splat"
#   status = 301
#   force = true
