<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1d"/>
      <stop offset="1" stop-color="#101a2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.32" r="0.55">
      <stop offset="0" stop-color="#1b6f6a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#1b6f6a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>
  <!-- grid -->
  <g stroke="#2a4a6a" stroke-opacity="0.18">
    <g>
      <line x1="0" y1="125" x2="1600" y2="125"/>
      <line x1="0" y1="250" x2="1600" y2="250"/>
      <line x1="0" y1="375" x2="1600" y2="375"/>
      <line x1="0" y1="500" x2="1600" y2="500"/>
      <line x1="0" y1="625" x2="1600" y2="625"/>
      <line x1="0" y1="750" x2="1600" y2="750"/>
      <line x1="0" y1="875" x2="1600" y2="875"/>
    </g>
    <g>
      <line x1="200" y1="0" x2="200" y2="1000"/>
      <line x1="400" y1="0" x2="400" y2="1000"/>
      <line x1="600" y1="0" x2="600" y2="1000"/>
      <line x1="800" y1="0" x2="800" y2="1000"/>
      <line x1="1000" y1="0" x2="1000" y2="1000"/>
      <line x1="1200" y1="0" x2="1200" y2="1000"/>
      <line x1="1400" y1="0" x2="1400" y2="1000"/>
    </g>
  </g>
  <!-- radar -->
  <g stroke="#3fae9c" stroke-opacity="0.18" fill="none">
    <circle cx="1120" cy="340" r="130"/>
    <circle cx="1120" cy="340" r="240"/>
    <circle cx="1120" cy="340" r="350"/>
    <line x1="1120" y1="-10" x2="1120" y2="690"/>
    <line x1="770" y1="340" x2="1470" y2="340"/>
  </g>
</svg>
